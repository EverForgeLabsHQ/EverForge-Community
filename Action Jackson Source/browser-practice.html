<!doctype html><html lang="en"><meta charset="utf-8"><title>Action Jackson Browser Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#121c17;color:#eff3e8;font:18px system-ui;padding:40px}h1{font-size:28px}#board{padding:45px;margin:30px 0;background:#174432;border-radius:45px;min-height:260px;display:flex;align-items:end;gap:25px;justify-content:center}button{font:700 var(--label,20px) system-ui;padding:18px 30px;min-width:130px;border:1px solid #8ca98d;border-radius:35px;color:white;background:#46664b;cursor:pointer}button:hover{background:#55795b}#result{color:#b0e777;font-size:24px;min-height:50px}label{display:block;margin:15px 0}select,input{font:inherit}aside{max-width:660px;color:#b3c2ad}</style><h1>Browser practice · no game, no money</h1><p id="result">Waiting for an actual mouse click…</p><label>Label size <input id="size" type="range" min="12" max="48" value="20" oninput="document.documentElement.style.setProperty('--label',this.value+'px')"></label><div id="board"><button onclick="hit('FOLD')">Fold</button><button onclick="hit('CHECK')">Check</button><button onclick="hit('CALL')">Call $20</button></div><aside>Keep this page visible. Action Jackson reads the button labels from your screen. The slider changes their size without moving to a new page.</aside><script>let count=0;function hit(action){document.querySelector('#result').textContent='Received '+action+' · clicks '+(++count);document.title=action+' ('+count+') — Action Jackson Browser Practice'}</script></html>
